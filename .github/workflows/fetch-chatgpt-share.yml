name: Fetch ChatGPT shared conversation
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover shared conversation response
        shell: bash
        run: |
          set -euo pipefail
          url='https://r.jina.ai/https://chatgpt.com/share/6a844445-5558-83e8-a713-1e79f6eedd30?ogimg=plain'
          curl --fail-with-body --location --retry 1 \
            -H 'X-Timeout: 60' \
            -H 'X-Cache-Tolerance: 3600' \
            -H 'X-With-Links-Summary: all' \
            "$url" -o share.md
          echo '===== SHARE BEGIN ====='
          cat share.md
          echo '===== SHARE END ====='
