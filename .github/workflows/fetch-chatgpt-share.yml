name: Fetch ChatGPT shared conversation
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch shared conversation JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          python -m pip install --quiet curl-cffi
          python - <<'PY'
          from curl_cffi import requests
          import json, os
          url='https://chatgpt.com/backend-api/share/6a844445-5558-83e8-a713-1e79f6eedd30'
          r=requests.get(url, impersonate='chrome', timeout=45)
          print('status:', r.status_code)
          print('content-type:', r.headers.get('content-type'))
          r.raise_for_status()
          data=r.json()
          with open('.tmp/chatgpt-share.json','w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
          print('title:', data.get('title'))
          print('messages:', len(data.get('linear_conversation') or []))
          print('bytes:', os.path.getsize('.tmp/chatgpt-share.json'))
          PY
      - name: Upload shared conversation
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-share
          path: .tmp/chatgpt-share.json
          retention-days: 1
