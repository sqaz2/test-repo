name: Fetch ChatGPT shared conversation
on:
  push:
    paths-ignore:
      - '.tmp/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch shared conversation JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          curl --fail-with-body --location \
            --retry 2 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36' \
            -H 'Accept: application/json' \
            'https://chatgpt.com/backend-api/share/6a844445-5558-83e8-a713-1e79f6eedd30' \
            -o .tmp/chatgpt-share.json
          python - <<'PY'
          import json, os
          p='.tmp/chatgpt-share.json'
          with open(p,'r',encoding='utf-8') as f:
              d=json.load(f)
          print('title:', d.get('title'))
          print('messages:', len(d.get('linear_conversation') or []))
          print('bytes:', os.path.getsize(p))
          PY
      - name: Commit fetched conversation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-share-fetcher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp/chatgpt-share.json
          git commit -m 'Fetch shared conversation' || exit 0
          git push
